name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: unzip -q HotbarTotem-Fabric-1_21_11-v1_1-source.zip -d project
      - run: gradle build
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: hotbar-totem-jar
          path: project/build/libs/hotbar-totem-1.1.0.jar
