name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Unzip if a zip exists
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -1)
          if [ -n "$ZIP" ]; then unzip -q "$ZIP" -d project; fi
      - name: Locate project
        run: |
          B=$(find . -name build.gradle -not -path './.github/*' | head -1)
          echo "DIR=$(dirname "$B")" >> $GITHUB_ENV
      - run: gradle build
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: hotbar-totem-jar
          path: |
            ${{ env.DIR }}/build/libs/*.jar
            !${{ env.DIR }}/build/libs/*-sources.jar
